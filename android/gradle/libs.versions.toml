[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.11.01"
activityCompose = "1.13.0"
navigation = "2.10.2"
lifecycle = "2.11.1"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
